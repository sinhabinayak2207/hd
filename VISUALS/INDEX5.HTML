<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Confirmed - Highway Delite</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
        }

        .header {
            background-color: #fff;
            padding: 15px 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e0e0e0;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border: 2px dashed #0095ff;
            border-radius: 8px;
        }

        .logo {
            width: 40px;
            height: 40px;
            background-color: #1a1a1a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            color: #fff;
        }

        .logo-text {
            color: #1a1a1a;
            font-size: 17px;
            font-weight: 600;
        }

        .logo-text span {
            display: block;
            font-size: 13px;
            font-weight: 400;
        }

        .search-container {
            display: flex;
            align-items: center;
            border: 2px dashed #0095ff;
            border-radius: 8px;
            overflow: hidden;
        }

        .search-input {
            padding: 12px 20px;
            width: 300px;
            border: none;
            background-color: #fff;
            font-size: 14px;
            outline: none;
        }

        .search-input::placeholder {
            color: #888;
        }

        .search-btn {
            padding: 12px 35px;
            background-color: #ffd700;
            border: none;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
        }

        .search-btn:hover {
            background-color: #ffed4e;
        }

        .blue-line {
            height: 4px;
            background-color: #0095ff;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 100px 20px;
            min-height: calc(100vh - 150px);
        }

        .success-icon {
            width: 100px;
            height: 100px;
            background-color: #28a745;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
            box-shadow: 0 4px 20px rgba(40, 167, 69, 0.3);
        }

        .checkmark {
            width: 50px;
            height: 50px;
            border: 5px solid white;
            border-top: none;
            border-right: none;
            transform: rotate(-45deg);
            margin-top: -10px;
            margin-left: -5px;
        }

        .confirmation-title {
            font-size: 36px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 20px;
        }

        .reference-id {
            font-size: 16px;
            color: #666;
            margin-bottom: 40px;
        }

        .home-btn {
            padding: 14px 40px;
            background-color: #d5d5d5;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            color: #555;
            transition: background-color 0.3s ease;
        }

        .home-btn:hover {
            background-color: #c5c5c5;
        }

        @media (max-width: 768px) {
            .header {
                padding: 15px 20px;
                flex-direction: column;
                gap: 15px;
            }
            
            .search-input {
                width: 200px;
            }

            .container {
                padding: 60px 20px;
            }

            .confirmation-title {
                font-size: 28px;
                text-align: center;
            }

            .success-icon {
                width: 80px;
                height: 80px;
            }

            .checkmark {
                width: 40px;
                height: 40px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo-container">
            <div class="logo">HD</div>
            <div class="logo-text">
                highway
                <span>delite</span>
            </div>
        </div>
        <div class="search-container">
            <input type="text" class="search-input" placeholder="">
            <button class="search-btn">Search</button>
        </div>
    </header>

    <div class="blue-line"></div>

    <div class="container">
        <div class="success-icon">
            <div class="checkmark"></div>
        </div>

        <h1 class="confirmation-title">Booking Confirmed</h1>
        
        <p class="reference-id">Ref ID: HUF568SO</p>

        <button class="home-btn" onclick="goHome()">Back to Home</button>
    </div>

    <script>
        function goHome() {
            alert('Redirecting to home page...');
            // window.location.href = '/';
        }

        // Search functionality
        document.querySelector('.search-btn').addEventListener('click', function() {
            const searchValue = document.querySelector('.search-input').value;
            if(searchValue) {
                alert(`Searching for: ${searchValue}`);
            }
        });

        document.querySelector('.search-input').addEventListener('keypress', function(e) {
            if(e.key === 'Enter') {
                document.querySelector('.search-btn').click();
            }
        });
    </script>
</body>
</html>

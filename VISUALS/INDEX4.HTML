<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Highway Delite</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
        }

        .header {
            background-color: #f5f5f5;
            padding: 20px 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e0e0e0;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo {
            width: 45px;
            height: 45px;
            background-color: #1a1a1a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            color: #fff;
        }

        .logo-text {
            color: #1a1a1a;
            font-size: 18px;
            font-weight: 600;
        }

        .logo-text span {
            display: block;
            font-size: 14px;
            font-weight: 400;
        }

        .search-container {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .search-input {
            padding: 12px 20px;
            width: 300px;
            border: none;
            border-radius: 5px;
            background-color: #e8e8e8;
            font-size: 14px;
        }

        .search-btn {
            padding: 12px 35px;
            background-color: #ffd700;
            border: none;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
        }

        .search-btn:hover {
            background-color: #ffed4e;
        }

        .back-button {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            color: #1a1a1a;
            background: none;
            border: none;
            cursor: pointer;
            padding: 20px 80px;
            font-weight: 500;
        }

        .back-button:hover {
            color: #555;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px 80px 60px;
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 40px;
        }

        .checkout-form {
            background: white;
            border: 3px solid #ffd700;
            border-radius: 12px;
            padding: 35px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-label {
            font-size: 14px;
            color: #333;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-input {
            padding: 14px 16px;
            border: none;
            background-color: #e8e8e8;
            border-radius: 6px;
            font-size: 14px;
            color: #666;
        }

        .form-input::placeholder {
            color: #999;
        }

        .form-input:focus {
            outline: 2px solid #ffd700;
            background-color: #f5f5f5;
        }

        .promo-row {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .promo-input {
            flex: 1;
            padding: 14px 16px;
            border: none;
            background-color: #e8e8e8;
            border-radius: 6px;
            font-size: 14px;
            color: #666;
        }

        .apply-btn {
            padding: 14px 30px;
            background-color: #1a1a1a;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
        }

        .apply-btn:hover {
            background-color: #333;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-label {
            font-size: 13px;
            color: #666;
            cursor: pointer;
        }

        .summary-card {
            background: #e8e8e8;
            border-radius: 12px;
            padding: 30px;
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            font-size: 15px;
        }

        .summary-row .label {
            color: #555;
        }

        .summary-row .value {
            font-weight: 600;
            color: #1a1a1a;
        }

        .summary-divider {
            height: 1px;
            background-color: #ccc;
            margin: 20px 0;
        }

        .total-row {
            font-size: 20px;
            font-weight: 700;
            padding: 15px 0 20px;
        }

        .pay-btn {
            width: 100%;
            padding: 16px;
            background-color: #ffd700;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            color: #1a1a1a;
        }

        .pay-btn:hover {
            background-color: #ffed4e;
        }

        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
                padding: 20px 40px;
            }
            .header {
                padding: 20px 40px;
            }
            .back-button {
                padding: 20px 40px;
            }
            .summary-card {
                position: static;
            }
        }

        @media (max-width: 768px) {
            .header {
                padding: 15px 20px;
                flex-direction: column;
                gap: 15px;
            }
            .container {
                padding: 20px;
            }
            .back-button {
                padding: 15px 20px;
            }
            .checkout-form {
                padding: 25px;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
            .search-input {
                width: 200px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo-container">
            <div class="logo">HD</div>
            <div class="logo-text">
                highway
                <span>delite</span>
            </div>
        </div>
        <div class="search-container">
            <input type="text" class="search-input" placeholder="Search experiences">
            <button class="search-btn">Search</button>
        </div>
    </header>

    <button class="back-button" onclick="window.history.back()">
        ← Checkout
    </button>

    <div class="container">
        <div class="checkout-form">
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Full name</label>
                    <input type="text" class="form-input" placeholder="Your name" id="fullName">
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-input" placeholder="Your name" id="email">
                </div>
            </div>

            <div class="promo-row">
                <input type="text" class="promo-input" placeholder="Promo code" id="promoCode">
                <button class="apply-btn" onclick="applyPromo()">Apply</button>
            </div>

            <div class="checkbox-container">
                <input type="checkbox" class="checkbox" id="termsCheckbox">
                <label class="checkbox-label" for="termsCheckbox">I agree to the terms and safety policy</label>
            </div>
        </div>

        <div class="summary-card">
            <div class="summary-row">
                <span class="label">Experience</span>
                <span class="value">Kayaking</span>
            </div>
            <div class="summary-row">
                <span class="label">Date</span>
                <span class="value">2025-10-22</span>
            </div>
            <div class="summary-row">
                <span class="label">Time</span>
                <span class="value">09:00 am</span>
            </div>
            <div class="summary-row">
                <span class="label">Qty</span>
                <span class="value">1</span>
            </div>

            <div class="summary-divider"></div>

            <div class="summary-row">
                <span class="label">Subtotal</span>
                <span class="value">₹999</span>
            </div>
            <div class="summary-row">
                <span class="label">Taxes</span>
                <span class="value">₹59</span>
            </div>

            <div class="summary-row total-row">
                <span class="label">Total</span>
                <span class="value">₹958</span>
            </div>

            <button class="pay-btn" onclick="processPayment()">Pay and Confirm</button>
        </div>
    </div>

    <script>
        function applyPromo() {
            const promoCode = document.getElementById('promoCode').value;
            if (promoCode.trim()) {
                alert(`Promo code "${promoCode}" applied!`);
            } else {
                alert('Please enter a promo code');
            }
        }

        function processPayment() {
            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const termsChecked = document.getElementById('termsCheckbox').checked;

            if (!fullName.trim()) {
                alert('Please enter your full name');
                return;
            }

            if (!email.trim()) {
                alert('Please enter your email');
                return;
            }

            if (!termsChecked) {
                alert('Please agree to the terms and safety policy');
                return;
            }

            alert('Payment successful! Booking confirmed for Kayaking on 2025-10-22 at 09:00 am');
        }

        // Search functionality
        document.querySelector('.search-btn').addEventListener('click', function() {
            const searchValue = document.querySelector('.search-input').value;
            if(searchValue) {
                alert(`Searching for: ${searchValue}`);
            }
        });

        document.querySelector('.search-input').addEventListener('keypress', function(e) {
            if(e.key === 'Enter') {
                document.querySelector('.search-btn').click();
            }
        });
    </script>
</body>
</html>
